version: 7.28.2

type: DeclarativeSource

check:
  type: CheckStream
  stream_names:
    - works

definitions:
  linked:
    HttpRequester:
      authenticator:
        type: BearerAuthenticator
        api_token: "{{ config['api_key'] }}"
    SimpleRetriever:
      paginator:
        type: DefaultPaginator
        page_size_option:
          type: RequestOption
          field_name: per_page
          inject_into: request_parameter
        pagination_strategy:
          type: CursorPagination
          page_size: 100
          cursor_value: "{{ response['meta']['next_cursor'] }}"
          stop_condition: "{{ not response.get('meta', {}).get('next_cursor') }}"

streams:
  - type: DeclarativeStream
    name: works
    retriever:
      type: SimpleRetriever
      decoder:
        type: JsonDecoder
      paginator:
        $ref: "#/definitions/linked/SimpleRetriever/paginator"
      requester:
        type: HttpRequester
        url: https://api.openalex.org/works
        http_method: GET
        authenticator:
          $ref: "#/definitions/linked/HttpRequester/authenticator"
        request_parameters:
          cursor: "{{ next_page_token['next_page_token'] if next_page_token else '*' }}"
          filter: publication_year:2026
          select: >-
            id,doi,title,publication_year,publication_date,type,cited_by_count,language,primary_location,authorships,topics
      record_selector:
        type: RecordSelector
        extractor:
          type: DpathExtractor
          field_path:
            - results
    primary_key: id
  - type: DeclarativeStream
    name: authors
    retriever:
